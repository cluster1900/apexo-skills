name: Test Computer Use catalog

on:
  pull_request:
    paths:
      - .grok-plugin/**
      - catalog.json
      - plugins/computer-use/**
      - .github/workflows/computer-use.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Verify the pinned catalog bundle
        run: sh plugins/computer-use/verify.sh
